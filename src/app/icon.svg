<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.3" stop-color="#312e81"/>
      <stop offset="0.6" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- ticket body -->
  <rect x="12" y="19" width="40" height="26" rx="5" fill="#ffffff"/>
  <!-- perforation (ticket stub edge) -->
  <line x1="29" y1="21" x2="29" y2="43" stroke="#c7d2fe" stroke-width="1.6" stroke-dasharray="3 2.6"/>
  <!-- stub dot -->
  <circle cx="22.5" cy="32" r="3.2" fill="#4338ca"/>
  <!-- checkmark -->
  <path d="M34 32.4l3.4 3.4 6.4-6.8" fill="none" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- progress -->
  <rect x="34" y="38.5" width="11" height="2.8" rx="1.4" fill="#c7d2fe"/>
</svg>
